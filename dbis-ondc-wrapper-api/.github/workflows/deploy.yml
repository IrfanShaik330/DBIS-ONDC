name: Deploy .NET App to AWS Elastic Beanstalk

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.x' 

    - name: Restore dependencies
      run: dotnet restore dbis-ondc-wrapper-api/ONDCPoC.sln

    - name: Build
      run: dotnet build dbis-ondc-wrapper-api/ONDCPoC.sln --configuration Release

    - name: Publish
      run: dotnet publish dbis-ondc-wrapper-api/ONDCPoC.sln -c Release -o ./publish


    - name: Zip published files
      run: Compress-Archive -Path ./publish/* -DestinationPath deploy.zip

    - name: Deployment to Elastic Beanstalk
      uses: einaregilsson/beanstalk-deploy@v21
      with:
        aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        application_name: deploy
        environment_name: Deploy-env
        region: ${{ secrets.AWS_REGION }}
        version_label: ${{ github.sha }}
        deployment_package: deploy.zip
